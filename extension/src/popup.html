<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OnAir Bridge</title>
    <style>
      :root {
        --ui-bg: #000000;
        --ui-surface: #0d0d0d;
        --ui-surface-2: #141414;
        --ui-input: #18181b;
        --ui-input-border: #27272a;
        --ui-border: rgba(255, 255, 255, 0.08);
        --ui-border-hover: rgba(255, 255, 255, 0.16);
        --ui-text: #e4e4e7;
        --ui-text-muted: #71717a;
        --ui-text-dim: #52525b;
        --ui-accent: #f59e0b;
        --ui-blue: #60a5fa;
        --ui-blue-dim: rgba(96, 165, 250, 0.14);
        --ui-ok: #4ade80;
        --ui-ok-dim: rgba(74, 222, 128, 0.12);
        --ui-err: #f87171;
        --ui-err-dim: rgba(248, 113, 113, 0.12);
        --ui-font: "Segoe UI", system-ui, -apple-system, sans-serif;
        --ui-mono: "Cascadia Code", "Consolas", "SF Mono", monospace;
        --ui-transition: 120ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 312px;
        padding: 12px;
        background: var(--ui-bg);
        color: var(--ui-text);
        font-family: var(--ui-font);
        font-size: 11.5px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .brand-icon {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        flex-shrink: 0;
      }

      .title {
        font-weight: 600;
        font-size: 12.5px;
        letter-spacing: 0.01em;
        color: var(--ui-text);
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 10px;
        font-size: 10.5px;
        font-weight: 500;
        white-space: nowrap;
        color: var(--ui-text-muted);
        background: rgba(255, 255, 255, 0.05);
      }

      .status-badge.ok {
        color: var(--ui-ok);
        background: var(--ui-ok-dim);
      }

      .status-badge.warn {
        color: var(--ui-accent);
        background: rgba(245, 158, 11, 0.14);
      }

      .status-badge.err {
        color: var(--ui-err);
        background: var(--ui-err-dim);
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--ui-text-dim);
      }

      .status-badge.ok .dot {
        background: var(--ui-ok);
      }

      .status-badge.warn .dot {
        background: var(--ui-accent);
        animation: pulse 1.2s ease-in-out infinite;
      }

      .status-badge.err .dot {
        background: var(--ui-err);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      /* ── Cards ── */
      .card {
        background: var(--ui-surface);
        border: 1px solid var(--ui-border);
        border-radius: 8px;
        padding: 10px 11px;
        margin-bottom: 8px;
      }

      .card:last-child {
        margin-bottom: 0;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .mirror-title {
        font-size: 12px;
        font-weight: 500;
        color: var(--ui-text);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .live-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ui-blue);
        background: var(--ui-blue-dim);
        border-radius: 4px;
        padding: 1px 5px;
      }

      .subtext {
        font-size: 10.5px;
        color: var(--ui-text-muted);
        margin-top: 2px;
      }

      .subtext.warn {
        color: var(--ui-accent);
      }

      /* ── Toggle switch (matches OnAir .sp-toggle) ── */
      .toggle {
        position: relative;
        width: 30px;
        height: 17px;
        flex-shrink: 0;
        cursor: pointer;
        display: inline-block;
      }

      .toggle.disabled {
        opacity: 0.35;
        cursor: default;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .toggle-track {
        position: absolute;
        inset: 0;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--ui-border-hover);
        transition: background var(--ui-transition), border-color var(--ui-transition);
      }

      .toggle input:checked ~ .toggle-track {
        background: var(--ui-blue);
        border-color: var(--ui-blue);
      }

      .toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.65);
        transition: left var(--ui-transition), background var(--ui-transition);
      }

      .toggle input:checked ~ .toggle-track .toggle-thumb {
        left: 15px;
        background: #ffffff;
      }

      /* ── Actions & Stats inside mirror card ── */
      .mirror-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 9px;
        padding-top: 8px;
        border-top: 1px solid var(--ui-border);
      }

      .stats-text {
        font-size: 10px;
        color: var(--ui-text-dim);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Form fields ── */
      .section-toggle {
        width: 100%;
        background: none;
        border: none;
        padding: 0;
        color: var(--ui-text-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        font-family: var(--ui-font);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .section-toggle:hover {
        color: var(--ui-text);
      }

      .section-meta {
        font-family: var(--ui-mono);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
        color: var(--ui-text-dim);
      }

      .setup-body {
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid var(--ui-border);
      }

      label.field {
        display: block;
        margin-bottom: 8px;
      }

      label.field span.label {
        display: block;
        margin-bottom: 4px;
        color: var(--ui-text-muted);
        font-size: 10.5px;
      }

      input[type="text"],
      input[type="number"],
      input[type="password"] {
        width: 100%;
        background: var(--ui-input);
        border: 1px solid var(--ui-input-border);
        border-radius: 4px;
        color: var(--ui-text);
        padding: 5px 7px;
        font-family: var(--ui-font);
        font-size: 11px;
        outline: none;
        transition: border-color var(--ui-transition);
      }

      input:focus {
        border-color: rgba(255, 255, 255, 0.3);
      }

      input.mono {
        font-family: var(--ui-mono);
        font-size: 10px;
      }

      .btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        border-radius: 4px;
        padding: 4px 9px;
        font-family: var(--ui-font);
        font-size: 10.5px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: background var(--ui-transition), color var(--ui-transition), border-color var(--ui-transition);
      }

      .btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
        color: var(--ui-text);
        border-color: var(--ui-border-hover);
      }

      .btn:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .btn.accent {
        color: var(--ui-blue);
        background: var(--ui-blue-dim);
        border-color: rgba(96, 165, 250, 0.28);
      }

      .btn.accent:hover:not(:disabled) {
        background: rgba(96, 165, 250, 0.24);
        color: #93c5fd;
      }

      .btn.primary {
        width: 100%;
        padding: 6px 10px;
        font-size: 11px;
      }

      .feedback {
        font-size: 10px;
        color: var(--ui-text-muted);
        margin-top: 6px;
        min-height: 14px;
      }

      .error-text {
        color: var(--ui-err);
        background: var(--ui-err-dim);
        border: 1px solid rgba(248, 113, 113, 0.22);
        border-radius: 4px;
        padding: 5px 7px;
        font-size: 10px;
        margin-top: 7px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img class="brand-icon" src="icon.png" alt="" />
        <span class="title">OnAir Bridge</span>
      </div>
      <span id="status-badge" class="status-badge">
        <span class="dot"></span>
        <span id="status-text">Checking...</span>
      </span>
    </div>

    <div class="card">
      <div class="row">
        <div style="min-width: 0">
          <div class="mirror-title">
            <span>Mirror this tab</span>
            <span id="live-chip" class="live-chip" hidden>Live</span>
          </div>
          <div id="tab-site" class="subtext">Checking current tab...</div>
        </div>
        <label id="tab-toggle-wrap" class="toggle disabled" title="Toggle live mirroring for this tab">
          <input id="tab-toggle" type="checkbox" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>

      <div id="mirror-footer" class="mirror-footer">
        <span id="stats-text" class="stats-text">Each reply opens a new OnAir tab</span>
        <button id="send-latest-btn" type="button" class="btn accent" disabled title="Send the newest answer on this page into a new OnAir tab">
          Send latest
        </button>
      </div>
    </div>

    <div class="card">
      <button id="setup-toggle" type="button" class="section-toggle" aria-expanded="true">
        <span>Connection</span>
        <span id="setup-meta" class="section-meta">:47821</span>
      </button>

      <div id="setup-body" class="setup-body">
        <label class="field">
          <span class="label">Extension ID (paste in OnAir Settings → Bridge)</span>
          <div class="row" style="gap: 5px">
            <input id="ext-id" type="text" class="mono" readonly />
            <button id="copy-ext-id" type="button" class="btn">Copy</button>
          </div>
        </label>

        <div class="row" style="align-items: flex-start; gap: 6px">
          <label class="field" style="width: 82px; flex-shrink: 0">
            <span class="label">Port</span>
            <input id="port-input" type="number" min="1024" max="65535" class="mono" />
          </label>

          <label class="field" style="flex: 1; min-width: 0">
            <span class="label">Pairing Token</span>
            <div class="row" style="gap: 4px">
              <input id="token-input" type="password" class="mono" placeholder="64-char hex token" />
              <button id="toggle-token-btn" type="button" class="btn" title="Show / hide token">Show</button>
            </div>
          </label>
        </div>

        <button id="save-btn" type="button" class="btn accent primary">Save &amp; Connect</button>
        <div id="feedback" class="feedback"></div>
        <div id="error-box" class="error-text" hidden></div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
